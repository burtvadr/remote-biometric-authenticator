[workspace]
resolver = "2"
members = ["protocol", "rbad", "rba-sim", "rba", "pam-rba", "polkit-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
rba-protocol = { path = "protocol" }
base64 = "0.22"

p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic", "std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hmac = { version = "0.12", default-features = false, features = ["std"] }
hkdf = { version = "0.12", default-features = false, features = ["std"] }
getrandom = "0.2"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[profile.release]
panic = "abort"
overflow-checks = true
