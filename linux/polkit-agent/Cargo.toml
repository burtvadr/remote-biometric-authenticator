[package]
name = "rba-polkit-agent"
description = "polkit authentication agent that obtains the authentication event from a remote authenticator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rba-polkit-agent"
path = "src/main.rs"

[dependencies]
rba-protocol.workspace = true
rbad = { path = "../rbad" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }