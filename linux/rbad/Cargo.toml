[package]
name = "rbad"
description = "Privileged-but-minimal daemon that verifies remote biometric authentications for a host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rbad"
path = "src/lib.rs"

[[bin]]
name = "rbad"
path = "src/main.rs"

[dependencies]
rba-protocol.workspace = true
rba-enrollment = { path = "../../crates/rba-enrollment" }
rand_core_10 = { package = "rand_core", version = "0.10" }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
p256.workspace = true
sha2.workspace = true
getrandom.workspace = true
rand_core.workspace = true
hex.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# Link to the distribution-maintained SQLite; STRICT tables require >= 3.37.
rusqlite = "=0.32.1"
# Android attestation: distribution OpenSSL path validation and X.509 extraction.
openssl = "=0.10.81"
x509-parser = "=0.18.1"
# Fixed-origin Android certificate status retrieval; no automatic decompression/proxy.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "native-tls"] }
httpdate = "=1.0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "time",
    "sync",
    "signal",
    "fs",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls-pemfile = "2"
rcgen = "0.13"
mdns-sd = "0.11"

[dev-dependencies]
rba-protocol.workspace = true
rba-sim = { path = "../rba-sim" }
hex.workspace = true
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
